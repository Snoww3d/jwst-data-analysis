name: Danger Zone

# Gates ONLY the PRs that can actually hurt. A PR touching none of the paths in
# `.claude/sdlc.json` -> `danger_zones.paths` passes immediately and merges
# autonomously, exactly as before. A PR touching one requires a human signal:
# an approving review from a non-bot, or the `danger-approved` label applied by
# the repo owner (a solo maintainer cannot review their own PR). It also needs
# a spec signal. See `.github/scripts/danger-zone.cjs` and the `sdlc` skill.
#
# `labeled` / `unlabeled` are triggers so applying or removing the label
# re-evaluates the gate without a new push.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  danger-zone:
    name: Danger Zone Gate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test the gate logic
        # The gate is security-relevant and has no other test runner. Fail the
        # check if its own unit tests fail, before trusting its verdict.
        run: node --test .github/scripts/danger-zone.test.cjs

      - name: Evaluate danger zones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/danger-zone.cjs
